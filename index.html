<html lang="th">
<head>

  <title>กำลังโหลดระบบเรียกน้อง...</title>
  <link rel="manifest" href="./manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    // เมื่อโหลดเสร็จ ให้เด้งไปยัง Web App ของ Google ทันที
    window.onload = function() {
      const webAppUrl = "https://script.google.com/macros/s/AKfycbxhRJpkPyS5s1GH5YbKtzUds3OnbBq9iR8e1AACV1Sbcm3CYko1MXk-ptlbJFsV-n6w/exec";
      window.location.replace(webAppUrl);
    };
  </script>
  <style>
    body { background: #f9f3fc; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #9b59b6; }
  </style>
</head>
<body>
  <h2>⏳ กำลังเชื่อมต่อระบบ...</h2>
</body>
</html>
